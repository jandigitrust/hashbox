[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hashbox-demo"
version = "0.1.0"
description = "Checkout-based CLI for Secure Boot Azure CVM instances"
readme = "README.md"
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hashbox = "hashbox.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hashbox*"]
